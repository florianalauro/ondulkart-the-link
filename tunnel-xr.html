<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>THE LINK — Ondulkart AR</title>

  <!--
    THE LINK — tunnel-xr.html
    ─────────────────────────────────────────────────────────────────────────────
    Nuova base dell'esperienza (iOS + Android):
      1. 8th Wall SLAM (6DoF) con Three.js DENTRO la pipeline XR8 -> video camera e
         farfalle escono dallo STESSO frame e dallo STESSO contesto WebGL (niente sfasamento).
      2. Ancoraggio al PANNELLO del totem (image target 8th Wall): posizione, asse del
         nastro (parallelo al pannello) e scala metrica. Ogni volta che il pannello
         rientra nell'inquadratura l'ancora viene ricorretta dolcemente (anti-drift).
      3. Farfalle in INSTANCING + animazione "baked" in texture (VAT): 2 draw call
         totali per tutto lo sciame, zero skinning su CPU/GPU.
      4. Tinta fucsia -> texture originale nello shader (solo sulle zone arancio).
      5. Mano (MediaPipe): alimentata dal pixel array a bassa risoluzione di 8th Wall,
         niente lettura del canvas WebGL.

    Parametri URL utili:
      ?preview   -> anteprima desktop SENZA AR (trascina per guardarti intorno)
      ?debug     -> HUD diagnostico + sagome del tunnel
      ?nohands   -> disattiva MediaPipe
      ?n=120     -> numero farfalle
    Tutti i valori di CFG sono modificabili anche dal vivo da console: CFG.speedMin = 1.5
  -->

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  } }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action: none; }
    #xrCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }

    .screen { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(90px, env(safe-area-inset-bottom)); }
    .hidden { display: none !important; }

    #start { background: rgba(0,0,0,0.92); }
    .logo-img { width: 240px; max-width: 70vw; height: auto; }
    .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .title { font-size: 4.2em; line-height: 1.05; color: #fe5000; font-weight: 800; }
    .sub { font-size: 0.9em; opacity: 0.8; font-style: italic; margin-top: 2px; }
    .btn { background: #fe5000; color: #fff; border: none; padding: 18px 44px; font-size: 1.35em;
      border-radius: 50px; font-weight: 700; box-shadow: 0 4px 18px rgba(254,80,0,0.45);
      animation: pulse 2s ease-in-out infinite; cursor: pointer; }
    .btn:active { transform: scale(0.96); }
    .btn.ghost { background: rgba(0,0,0,0.45); border: 2px solid #fe5000; box-shadow: none; animation: none;
      font-size: 0.95em; padding: 12px 22px; }
    @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 4px 28px rgba(254,80,0,0.75); } }

    /* Calibrazione: semitrasparente, il video si vede sotto */
    #calib { background: rgba(0,0,0,0.35); justify-content: center; gap: 18px; pointer-events: none; }
    #calib .frame { width: 58vw; max-width: 260px; aspect-ratio: 1 / 1; border: 3px solid #fe5000;
      border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.25); position: relative; }
    #calib .frame::after { content: ''; position: absolute; left: 8%; right: 8%; height: 3px; top: 10%;
      background: #fe5000; box-shadow: 0 0 12px #fe5000; animation: scan 2.2s ease-in-out infinite; }
    @keyframes scan { 50% { top: 88%; } }
    #calib h2 { color: #fe5000; font-size: 1.25em; letter-spacing: 0.02em; }
    #calib p { font-size: 0.92em; opacity: 0.9; max-width: 320px; }
    #calib .btn { pointer-events: auto; }

    #rotate { background: rgba(0,0,0,0.95); justify-content: center; gap: 16px; z-index: 3000; }
    #rotate .phone { width: 46px; height: 78px; border: 3px solid #fe5000; border-radius: 9px; animation: rot 2s ease-in-out infinite; }
    @keyframes rot { 50% { transform: rotate(-90deg); } }

    #error { background: rgba(20,20,20,0.96); justify-content: center; gap: 14px; z-index: 4000; }
    #error h2 { color: #fe5000; }

    #handLottie { position: fixed; pointer-events: none; z-index: 900; display: none; transform: translate(-50%, -50%); }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 950; pointer-events: none;
      background: rgba(220,0,60,0.92); color: #fff; font-weight: 600; text-align: center;
      padding: 10px 18px; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      opacity: 0; transition: opacity 0.25s; }
    #tooClose { top: 14%; font-size: 15px; }
    #rude { top: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; padding: 18px 26px; max-width: 82%; }

    #hud { position: fixed; left: 8px; bottom: 8px; z-index: 5000; background: rgba(0,0,0,0.75); color: #0ff;
      font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 6px 9px; border-radius: 6px; white-space: pre; pointer-events: none; }

  <!-- CALIBRAZIONE: inquadra il pannello del totem -->
  <div id="calib" class="screen hidden">
    <div class="frame"></div>
    <h2>INQUADRA IL QR SUL TOTEM</h2>
    <p>Avvicinati al totem davanti a te e inquadra dall'alto il QR sul piano superiore</p>

  </div>

  <div id="rotate" class="screen hidden">

  <div id="handLottie"><lottie-player id="lottieAnim" src="truck.json" background="transparent" speed="1.4" style="width:180px;height:180px;" loop></lottie-player></div>
  <div id="tooClose" class="toast">✋ Allontana la mano dallo schermo</div>
  <div id="rude" class="toast">Sostenibilità non è maleducazione</div>
  <div id="hud" class="hidden"></div>

  <script>
    // ── PARAMETRI (metri reali) ────────────────────────────────────────────────
    // Sistema di riferimento del TUNNEL, con origine sul PAVIMENTO sotto il centro del pannello:
    //   +X = destra di chi guarda il pannello (le farfalle arrivano da qui, fucsia)
    //   -X = sinistra (escono da qui, arancioni)
    //   +Z = verso il visitatore (davanti al pannello)   -Z = verso il nastro (dietro il totem)
    //   +Y = su
    const Q = new URLSearchParams(location.search);
    window.CFG = {
      // Tunnel / sciame
      tunnelLength: 28,        // m, il totem e' a meta' -> farfalle da x=+14 a x=-14
      bandNear: 0.3,           // m dietro il pannello: bordo vicino dello sciame
      bandFar: 6.5,            // m dietro il pannello: bordo lontano (tunnel largo 7.5)
      yMin: 1.2,               // m dal pavimento
      yMax: 3.1,               // m dal pavimento (soffitto 3.3)
      count: +(Q.get('n') || 90),
      speedMin: 28 / 14,       // m/s (come prima: 10-14 s per 28 m)
      speedMax: 28 / 10,
      // Scala del modello. Il GLB e' largo 2.48 unita': in A-Frame 0.2 non si notava (unita'
      // non metriche + FOV 80°), ma qui la scena e' in METRI reali e usa il FOV vero della
      // fotocamera (piu' stretto): 0.2 = farfalle da 50 cm, viste ~1.7x piu' grandi di
      // butterfly-experience. 0.115 riproduce la stessa grandezza a schermo. Prova dal vivo: ?size=0.1
      size: +(Q.get('size') || 0.115),
      sizeJitter: 0.25,        // +-25% di variazione
      flapSpeed: 1.0,          // velocita' battito rispetto al clip originale
      bob: 0.08,               // m, oscillazione verticale
      edgeFade: 1.5,           // m, farfalle che crescono/spariscono agli estremi del tratto visibile
      // Tratto VISIBILE del volo, centrato sul totem. Il tunnel e' lungo 28 m, ma a 1 m di
      // distanza una traiettoria di +-14 m copre quasi 180°: le farfalle sembrano arrivare da
      // dietro a destra e girarti intorno fino a dietro a sinistra. Con +-7 m il volo si legge
      // come una linea da destra a sinistra DAVANTI al visitatore.
      visibleHalfLength: 7,
      windowFollowTau: 0.6,    // s, quanto dolcemente il tratto visibile segue il visitatore
      colorA: '#ce0058',       // fucsia (entrata, lato destro)
      colorB: '#fe5000',       // arancione (uscita, lato sinistro)
      // Passaggio di colore a META' DEL TUNNEL. tunnelMidX = distanza (m) della meta' del tunnel
      // dal totem lungo il nastro (+ = verso destra, da dove arrivano le farfalle). Col totem a
      // meta' del nastro vale 0; se il totem viene spostato, basta aggiornare questo valore.
      tunnelMidX: 0,
      colorBlend: 1.2,         // m prima/dopo la meta' in cui il colore sfuma (fucsia -> arancione)
      emissive: 0.6,           // autoilluminazione ali (come butterfly-experience)
      envIntensity: +(Q.get('env') || 0.5),   // riflessi dell'ambiente (0 = nessuno)

      // Pannello / image target
      // Target = TUTTO il piano superiore del totem (28 x 28 cm: "Enjoy The Butterfly Experience" + QR),
      // ricavato dalla foto dall'alto e ripulito dall'ombra. Il vecchio qrcode.json conteneva un
      // QR DIVERSO da quello stampato sul totem: per questo non veniva mai riconosciuto.
      targetName: '',          // vuoto = accetta qualunque target caricato (il nome arriva dal json)
      targetJson: 'image-targets/totem-top.json',
      targetLongSideM: 0.28,   // lato del piano del totem. Il target e' un ritaglio 3:4 (21 x 28 cm)
                               // centrato: il lato LUNGO coincide col lato intero del piano.
      targetCenterHeightM: 0.80, // quota del centro del QR: piano superiore del totem (28 x 28 cm, h 80 cm)
      targetMount: 'top',      // 'top' = QR orizzontale sul piano del totem (a terra: 'top' con altezza 0)
                               // 'vertical' = pannello verticale rivolto al visitatore
      topYawOffsetDeg: 0,      // ritocco fine della direzione del nastro (gradi, + = antiorario visto dall'alto)
      horizontalMinNy: 0.8,    // sotto questo valore la posa del target e' considerata inclinata (solo posizione)
      maxViewAngleDeg: 65,     // oltre questo angolo di vista la posa del target non si usa
      maxTargetDistM: 3.5,     // oltre questa distanza la posa del target non si usa
      anchorTau: 0.35,         // s, morbidezza della ricorrezione (piu' alto = piu' morbido)
      scaleTau: 1.5,           // s, morbidezza della scala metrica
      jumpDistM: 0.8,          // correzioni piu' grandi richiedono conferma su piu' frame
      jumpYawDeg: 20,
      jumpConfirmFrames: 6,
      skipAfterMs: 9000,       // dopo quanto compare "Continua senza pannello"
      fallbackDistM: 1.0,      // senza pannello: il totem si assume a 1 m davanti

      // Camera / rendering
      camHeight: 1.45,         // m, altezza stimata del telefono (scala 'responsive' di 8th Wall)
      maxDpr: IS_IOS() ? 2 : 1.5,

      // Mano
      hands: !Q.has('nohands'),
      handFps: 12,
      handOffsetX: 0,
      tooCloseFrac: 0.42,
      lottieScale: 1.1,

      debug: Q.has('debug'),
      preview: Q.has('preview'),
    };
    function IS_IOS() { return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  </script>

  <!-- 8th Wall (engine binary self-hosted, stesso di 8thwall.html) -->
  <script>
    if (!new URLSearchParams(location.search).has('preview')) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"><\/script>');
    }
  </script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.THREE = THREE; // XR8.Threejs usa window.THREE

  const CFG = window.CFG;
  // v2 (rifatto in Blender): ali con curvatura e piu' geometria, punte che flettono in ritardo,
  // corpo che sobbalza col battito, texture 1024 + normal map (venature/squame) + ruvidita'.
  // ?model=v1 per confrontare col modello originale.
  const MODEL_PATH = Q.get('model') === 'v1' ? 'assets/models/animated_butterfly_fucsia.glb' : 'assets/models/animated_butterfly_v2.glb';
  const $ = (id) => document.getElementById(id);

  // ═════════════════════════════════════════════════════════════════════════
  // 1. STATO DELL'ANCORA (tunnel nel mondo SLAM)
  // ═════════════════════════════════════════════════════════════════════════
  const anchor = {
    ready: false,        // il tunnel e' stato piazzato almeno una volta
    fromTarget: false,   // piazzato dal pannello (true) o in fallback (false)
    pos: new THREE.Vector3(),  // punto sul PAVIMENTO sotto il centro del pannello (unita' scena)
    yaw: 0,              // rotazione Y del tunnel
    upm: 1,              // unita' scena per metro (scala metrica misurata sul pannello)
    upmSamples: 0,
    lastSeen: 0,         // ms ultimo campione valido del pannello
    corrections: 0,
    pending: 0,          // frame consecutivi che confermano un "salto"
    lastDelta: 0, lastDYaw: 0,
  };

  let scene, camera, renderer, tunnel, swarm = null, clock = new THREE.Clock();
  let started = false, trackingStatus = '-', trackingReason = '';
  const tgtDiag = { json: '-', loading: 0, scanning: 0, found: 0, updated: 0, rejected: 0, lastReject: '' };

  // ═════════════════════════════════════════════════════════════════════════
  // 2. FARFALLE: bake dell'animazione in texture (VAT) + instancing
  // ═════════════════════════════════════════════════════════════════════════
  // Il GLB ha 3 mesh skinnate (corpo 2461 vertici + 2 ali 720) e 53 ossa. Farne 90 cloni
  // skinnati = 90 mixer + 270 draw call + skinning a ogni frame. Qui campioniamo UNA volta
  // il clip "Flying" (20 pose) e salviamo le posizioni/normali dei vertici in una texture
  // float: nello shader ogni vertice legge la sua posa e interpola fra due frame.
  // Risultato: 2 InstancedMesh (corpo, ali) -> 2 draw call per l'intero sciame.

  const TINT_CHUNK = `
    uniform vec3 uColA; uniform vec3 uColB; uniform float uRefV; uniform vec2 uTintHue; uniform float uTintSatMin;
    varying float vBfTint;
    vec3 bfRgb2Hsv(vec3 c) {
      vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
      vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
      vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
      float d = q.x - min(q.w, q.y);
      return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1.0e-10)), d / (q.x + 1.0e-10), q.x);
    }
    vec3 bfHsv2Rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }
    vec3 bfTint(vec3 base) {
      vec3 hsv = bfRgb2Hsv(base);
      float deg = hsv.x * 360.0;
      float w = smoothstep(uTintHue.x - 5.0, uTintHue.x + 5.0, deg);
      w *= 1.0 - smoothstep(uTintHue.y - 8.0, uTintHue.y + 8.0, deg);
      w *= smoothstep(uTintSatMin, uTintSatMin + 0.15, hsv.y);
      // colore brand (fucsia -> arancione) scalato sulla luminosita' del pixel: il pixel medio
      // dell'ala esce col colore esatto, venature e ombre della texture restano leggibili
      vec3 brand = mix(uColA, uColB, vBfTint);
      vec3 tinted = min(brand * (hsv.z / uRefV), vec3(1.0));
      return mix(base, tinted, clamp(w, 0.0, 1.0));
    }`;

  function patchMaterial(mat, vat, withTint, uniforms) {
    mat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms, {
        uVat: { value: vat.texture },
        uVatSize: { value: new THREE.Vector2(vat.width, vat.height) },
        uFrames: { value: vat.frames },
      });
      shader.vertexShader = `
        attribute float aVid; attribute float aPhase; attribute float aTint; attribute float aRate;
        uniform sampler2D uVat; uniform vec2 uVatSize; uniform float uFrames;
        uniform float uTime; uniform float uFps; uniform float uFlap;
        varying float vBfTint;
        vec3 bfFetch(float row) { return texture2D(uVat, vec2((aVid + 0.5) / uVatSize.x, (row + 0.5) / uVatSize.y)).xyz; }
      ` + shader.vertexShader
        .replace('#include <beginnormal_vertex>', `
          float bfT = (uTime * uFlap * aRate + aPhase) * uFps;
          float bfF0 = mod(floor(bfT), uFrames);
          float bfF1 = mod(bfF0 + 1.0, uFrames);
          float bfA = fract(bfT);
          vec3 objectNormal = normalize(mix(bfFetch(bfF0 + uFrames), bfFetch(bfF1 + uFrames), bfA));
          #ifdef USE_TANGENT
            vec3 objectTangent = vec3(tangent.xyz);
          #endif`)
        .replace('#include <begin_vertex>', `
          vec3 transformed = mix(bfFetch(bfF0), bfFetch(bfF1), bfA);
          vBfTint = aTint;`);
      if (withTint) {
        shader.fragmentShader = TINT_CHUNK + '\n' + shader.fragmentShader
          .replace('#include <map_fragment>', '#include <map_fragment>\n diffuseColor.rgb = bfTint(diffuseColor.rgb);')
          .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance = bfTint(totalEmissiveRadiance);');
      }
    };
    mat.customProgramCacheKey = () => 'bfVat' + (withTint ? 'T' : '');
  }

  async function buildButterflyAssets() {
    const gltf = await new GLTFLoader().loadAsync(MODEL_PATH);
    const root = gltf.scene;
    root.updateMatrixWorld(true);
    const clip = THREE.AnimationClip.findByName(gltf.animations, 'Flying') || gltf.animations[0];
    const mixer = new THREE.AnimationMixer(root);
    mixer.clipAction(clip).play();

    const skinned = [];
    root.traverse((o) => { if (o.isSkinnedMesh) skinned.push(o); });
    // Raggruppa per materiale: ali (texture) e corpo
    const groups = {};
    for (const m of skinned) {
      const key = m.material.name === 'Wings' ? 'wings' : 'body';
      (groups[key] = groups[key] || []).push(m);
    }

    const FR = 20; // il clip ha 20 chiavi (0.83 s @ 24 fps)
    const fps = FR / clip.duration;
    const out = {};
    const v = new THREE.Vector3();

    for (const [key, meshes] of Object.entries(groups)) {
      // geometria unita (uv, indici) + id vertice
      let vCount = 0; for (const m of meshes) vCount += m.geometry.attributes.position.count;
      const uv = new Float32Array(vCount * 2), vid = new Float32Array(vCount);
      const idx = []; let off = 0;
      for (const m of meshes) {
        const g = m.geometry, n = g.attributes.position.count;
        if (g.attributes.uv) uv.set(g.attributes.uv.array.subarray(0, n * 2), off * 2);
        const gi = g.index ? g.index.array : [...Array(n).keys()];
        for (let i = 0; i < gi.length; i++) idx.push(gi[i] + off);
        for (let i = 0; i < n; i++) vid[off + i] = off + i;
        off += n;
      }
      // VAT: righe [0..FR) posizioni, [FR..2FR) normali
      const W = vCount, H = FR * 2;
      const data = new Float32Array(W * H * 4);
      const tmp = new THREE.BufferGeometry();
      const tmpPos = new THREE.BufferAttribute(new Float32Array(vCount * 3), 3);
      tmp.setAttribute('position', tmpPos); tmp.setIndex(idx);
      for (let f = 0; f < FR; f++) {
        mixer.setTime((f / FR) * clip.duration);
        root.updateMatrixWorld(true);
        let o = 0;
        for (const m of meshes) {
          const n = m.geometry.attributes.position.count;
          for (let i = 0; i < n; i++) {
            m.getVertexPosition(i, v);        // include lo skinning
            v.applyMatrix4(m.matrixWorld);    // spazio del modello (con le rotazioni Sketchfab)
            tmpPos.setXYZ(o + i, v.x, v.y, v.z);
          }
          o += n;
        }
        tmp.computeVertexNormals();
        const nrm = tmp.attributes.normal;
        for (let i = 0; i < vCount; i++) {
          const pi = (f * W + i) * 4, ni = ((f + FR) * W + i) * 4;
          data[pi] = tmpPos.getX(i); data[pi + 1] = tmpPos.getY(i); data[pi + 2] = tmpPos.getZ(i); data[pi + 3] = 1;
          data[ni] = nrm.getX(i); data[ni + 1] = nrm.getY(i); data[ni + 2] = nrm.getZ(i); data[ni + 3] = 0;
        }
      }
      const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
      tex.minFilter = tex.magFilter = THREE.NearestFilter;
      tex.generateMipmaps = false; tex.needsUpdate = true;

      const geo = new THREE.BufferGeometry();
      // position/normal servono solo per il bounding e per i define di three: la posa vera arriva dalla VAT
      geo.setAttribute('position', new THREE.BufferAttribute(data.slice(0, W * 4).filter((_, i) => i % 4 !== 3), 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(vCount * 3).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.setAttribute('aVid', new THREE.BufferAttribute(vid, 1));
      geo.setIndex(idx);
      out[key] = { geo, vat: { texture: tex, width: W, height: H, frames: FR }, material: meshes[0].material };
      tmp.dispose();
    }
    out.fps = fps;
    return out;
  }

  // ── Sciame ────────────────────────────────────────────────────────────────
  function createSwarm(assets) {
    const N = CFG.count;
    const uniforms = {
      uTime: { value: 0 }, uFps: { value: assets.fps }, uFlap: { value: CFG.flapSpeed },
      // three r158 ha ColorManagement attivo: new Color('#hex') e' GIA' in lineare
      // (non riconvertire, altrimenti l'arancione perde il verde e diventa rosso).
      uColA: { value: new THREE.Color(CFG.colorA) },
      uColB: { value: new THREE.Color(CFG.colorB) },
      uRefV: { value: 0.8 },   // V mediana (lineare) dell'arancio della texture
      uTintHue: { value: new THREE.Vector2(0, 50) },   // finestra dell'arancio (spazio lineare)
      uTintSatMin: { value: 0.25 },
    };
    const phase = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
    const rate = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);   // battito +-18%
    const tint = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
    tint.setUsage(THREE.DynamicDrawUsage);

    const meshes = [];
    for (const key of ['body', 'wings']) {
      const a = assets[key]; if (!a) continue;
      const mat = a.material.clone();
      mat.side = THREE.DoubleSide;
      if (key === 'wings') mat.emissiveIntensity = CFG.emissive;
      mat.envMapIntensity = CFG.envIntensity;
      patchMaterial(mat, a.vat, key === 'wings', uniforms);
      a.geo.setAttribute('aPhase', phase);
      a.geo.setAttribute('aRate', rate);
      a.geo.setAttribute('aTint', tint);
      const im = new THREE.InstancedMesh(a.geo, mat, N);
      im.frustumCulled = false;
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      meshes.push(im);
      tunnel.add(im);
    }
    // corpo e ali condividono le stesse matrici d'istanza
    for (let i = 1; i < meshes.length; i++) meshes[i].instanceMatrix = meshes[0].instanceMatrix;

    // TRATTO VISIBILE CHE SEGUE IL VISITATORE: le farfalle volano in una finestra di
    // +-visibleHalfLength metri centrata sulla posizione del visitatore lungo il nastro, sempre
    // dentro i limiti reali del tunnel. Le coordinate restano quelle del TUNNEL (ancorate al
    // mondo), quindi camminando le farfalle si avvicinano e restano indietro come oggetti veri,
    // e il colore dipende dal punto del tunnel in cui si trovano (fucsia prima della meta',
    // arancione dopo), non da dove sta il visitatore.
    const tunnelMin = CFG.tunnelMidX - CFG.tunnelLength / 2;
    const tunnelMax = CFG.tunnelMidX + CFG.tunnelLength / 2;
    const half = Math.min(CFG.visibleHalfLength, CFG.tunnelLength / 2), L = half * 2;
    let winC = Math.min(tunnelMax - half, Math.max(tunnelMin + half, 0));   // centro finestra (m, x tunnel)
    const _camLocal = new THREE.Vector3();
    const b = [];
    for (let i = 0; i < N; i++) {
      phase.array[i] = Math.random() * 10;
      rate.array[i] = 0.82 + Math.random() * 0.36;
      b.push(newLane({}, true));
    }
    phase.needsUpdate = true;

    function newLane(o, first) {
      o.x = first ? (winC + Math.random() * L - half) : Math.min(tunnelMax, winC + half);
      o.y = CFG.yMin + Math.random() * (CFG.yMax - CFG.yMin);
      o.z = -(CFG.bandNear + Math.random() * (CFG.bandFar - CFG.bandNear));
      o.speed = CFG.speedMin + Math.random() * (CFG.speedMax - CFG.speedMin);
      o.s = CFG.size * (1 + (Math.random() * 2 - 1) * CFG.sizeJitter);
      o.bobF = 0.6 + Math.random() * 0.8; o.bobP = Math.random() * 6.28;
      o.yawP = Math.random() * 6.28;
      return o;
    }

    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    let t = 0;
    return {
      meshes, uniforms,
      update(dt) {
        t += dt; uniforms.uTime.value = t; uniforms.uFlap.value = CFG.flapSpeed;
        // posizione del visitatore lungo il nastro (x nel sistema del tunnel, in metri)
        if (camera && tunnel) {
          tunnel.updateMatrixWorld();
          _camLocal.copy(camera.position);
          tunnel.worldToLocal(_camLocal);
          const target = Math.min(tunnelMax - half, Math.max(tunnelMin + half, _camLocal.x));
          winC += (target - winC) * (1 - Math.exp(-dt / CFG.windowFollowTau));
          window._visitorX = _camLocal.x; window._winC = winC;
        }
        const wMin = Math.max(tunnelMin, winC - half), wMax = Math.min(tunnelMax, winC + half);
        for (let i = 0; i < N; i++) {
          const o = b[i];
          o.x -= o.speed * dt;                    // destra -> sinistra
          if (o.x < wMin) newLane(o, false);      // uscita dalla finestra (o fine tunnel): rientra a destra
          const fade = Math.min(1, (o.x - wMin) / CFG.edgeFade, (wMax - o.x) / CFG.edgeFade);
          const k = Math.max(0.001, fade) * o.s;
          p.set(o.x, o.y + Math.sin(t * o.bobF * 2.2 + o.bobP) * CFG.bob, o.z);
          // modello rivolto a +Z: -90° lo fa volare verso -X, piu' un leggero ondeggiamento
          q.setFromAxisAngle(up, -Math.PI / 2 + Math.sin(t * 0.7 + o.yawP) * 0.12);
          s.set(k, k * 0.75, k);                  // stessa scala non uniforme di A-Frame (0.2 0.15 0.2)
          m4.compose(p, q, s);
          meshes[0].setMatrixAt(i, m4);
          // 0 = fucsia, 1 = arancione, smoothstep attorno alla meta' del tunnel
          let kc = (CFG.tunnelMidX + CFG.colorBlend - o.x) / (2 * CFG.colorBlend);
          kc = Math.min(1, Math.max(0, kc));
          tint.array[i] = kc * kc * (3 - 2 * kc);
        }
        meshes[0].instanceMatrix.needsUpdate = true;
        tint.needsUpdate = true;
      },
    };
  }

  // ═════════════════════════════════════════════════════════════════════════
  // 3. SCENA
  // ═════════════════════════════════════════════════════════════════════════
  function setupScene(sc) {
    scene = sc;
    tunnel = new THREE.Group();
    tunnel.visible = false;
    scene.add(tunnel);
    // Stesse luci di butterfly-experience (hemisphere 0.8 + directional 0.9, emissive 0.6).
    // three r158 usa luci "fisiche": x PI per avere la stessa resa della scala legacy di A-Frame.
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b8b8, 0.8 * Math.PI));
    // Riflessi morbidi (ambiente neutro): danno volume a ali curve e normal map.
    if (renderer && !Q.has('noenv')) {
      const pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
      pm.dispose();
    }
    const d = new THREE.DirectionalLight(0xffffff, 0.9 * Math.PI); d.position.set(0.6, 2, 1.2); scene.add(d);
    if (CFG.debug || CFG.preview) addDebugHelpers();
  }

  function addDebugHelpers() {
    const L = CFG.tunnelLength;
    const mat = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.6 });
    // pavimento del tunnel (28 x 7.5): da +1 m davanti al pannello a -6.5 m dietro
    const pts = [[-L / 2, 1], [L / 2, 1], [L / 2, -6.5], [-L / 2, -6.5], [-L / 2, 1]].map(([x, z]) => new THREE.Vector3(x, 0, z));
    tunnel.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    // fascia dello sciame
    const vh = Math.min(CFG.visibleHalfLength, L / 2);
    const band = new THREE.Box3(new THREE.Vector3(-vh, CFG.yMin, -CFG.bandFar), new THREE.Vector3(vh, CFG.yMax, -CFG.bandNear));
    tunnel.add(new THREE.Box3Helper(band, 0xff00aa));
    // pannello
    // totem 28 x 28 x 80 cm con il QR sul piano superiore
    const totem = new THREE.Mesh(new THREE.BoxGeometry(0.28, CFG.targetCenterHeightM, 0.28),
      new THREE.MeshBasicMaterial({ color: 0x777777, wireframe: true }));
    totem.position.set(0, CFG.targetCenterHeightM / 2, 0);
    tunnel.add(totem);
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(CFG.targetLongSideM, CFG.targetLongSideM),
      new THREE.MeshBasicMaterial({ color: 0xfe5000, side: THREE.DoubleSide }));
    if (CFG.targetMount !== 'vertical') panel.rotation.x = -Math.PI / 2;
    panel.position.set(0, CFG.targetCenterHeightM + 0.002, 0);
    tunnel.add(panel);
    // freccia di marcia
    tunnel.add(new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(2, 0.05, 0.5), 3, 0xffdd00));
  }

  function applyAnchor() {
    tunnel.position.copy(anchor.pos);
    tunnel.rotation.set(0, anchor.yaw, 0);
    tunnel.scale.setScalar(anchor.upm);
  }

  // ═════════════════════════════════════════════════════════════════════════
  // 4. ANCORAGGIO AL PANNELLO (image target) + correzione del drift
  // ═════════════════════════════════════════════════════════════════════════
  const _v = new THREE.Vector3(), _n = new THREE.Vector3(), _q = new THREE.Quaternion(), _toCam = new THREE.Vector3();
  const TOP_AXES = [new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, -1, 0), new THREE.Vector3(-1, 0, 0)];
  const _ax = new THREE.Vector3();
  const wrap = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

  function rej(why) { tgtDiag.rejected++; tgtDiag.lastReject = why; }
  function onTargetPose(detail) {
    if (!detail || (CFG.targetName && detail.name !== CFG.targetName)) return;
    const now = performance.now();
    const p = _v.set(detail.position.x, detail.position.y, detail.position.z);
    _q.set(detail.rotation.x, detail.rotation.y, detail.rotation.z, detail.rotation.w);

    // Scala metrica: dimensione del target in unita' scena / dimensione reale.
    const sw = detail.scaledWidth || 1, sh = detail.scaledHeight || 1;
    const longUnits = (detail.scale || 1) * Math.max(sw, sh);
    const upmSample = longUnits / CFG.targetLongSideM;
    if (!(upmSample > 0.2 && upmSample < 5)) return rej('scala ' + upmSample.toFixed(2));

    // Direzione del nastro.
    let yaw;
    _toCam.copy(camera.position).sub(p);
    const dist = _toCam.length() / upmSample;
    if (dist > CFG.maxTargetDistM) return rej('lontano ' + dist.toFixed(1) + 'm');
    _toCam.normalize();
    _n.set(0, 0, 1).applyQuaternion(_q);          // normale del target
    const cosView = Math.abs(_n.dot(_toCam));
    if (cosView < Math.cos(CFG.maxViewAngleDeg * Math.PI / 180)) return rej('angolo ' + Math.round(Math.acos(cosView) * 180 / Math.PI) + '°');   // vista troppo di taglio

    if (CFG.targetMount === 'vertical') {
      // pannello verticale: la normale punta al visitatore, il nastro gli e' parallelo
      if (_n.dot(_toCam) < 0) _n.negate();
      _n.y = 0;
      if (_n.lengthSq() < 0.25) return;
      _n.normalize();
      yaw = Math.atan2(_n.x, _n.z);
    } else {
      // QR ORIZZONTALE sul piano del totem. La direzione del nastro si ricava dai LATI del
      // QR (che devono essere paralleli / perpendicolari al nastro). Al primo aggancio si
      // sceglie, fra i 4 lati, quello che punta piu' "in avanti" rispetto allo sguardo del
      // visitatore (che guarda verso il nastro). Non importa come e' ruotato il QR sul totem
      // ne' come 8th Wall ha ritagliato il target: conta solo che i lati siano allineati al nastro.
      // Test sul campo: al primo aggancio la posa era perfetta, ma rivedendo il totem da altri
      // lati 8th Wall restituiva una normale NON verticale e ogni correzione veniva scartata
      // ("non orizzontale") -> la deriva restava. Ora:
      //  - la POSIZIONE del centro del piano si usa sempre (e' la stima piu' affidabile);
      //  - la direzione si aggiorna solo se il piano risulta davvero orizzontale;
      //  - il lato "verso il nastro" si sceglie OGNI volta come quello piu' vicino alla
      //    direzione attuale del tunnel, cosi' se 8th Wall ruota di 90/180° il riferimento
      //    interno del target (succede fra un aggancio e l'altro) non si perde il verso.
      tgtDiag.ny = _n.y;
      const flat = Math.abs(_n.y) > CFG.horizontalMinNy;
      if (!flat && !(anchor.ready && anchor.fromTarget)) return rej('non orizzontale ny ' + _n.y.toFixed(2));
      if (!flat) {
        yaw = anchor.yaw;                           // solo posizione
        tgtDiag.posOnly = (tgtDiag.posOnly || 0) + 1;
      } else {
        let ref;
        if (anchor.ready && anchor.fromTarget) {
          ref = new THREE.Vector3(-Math.sin(anchor.yaw), 0, -Math.cos(anchor.yaw));   // -Z tunnel attuale
        } else {
          // primo aggancio: "avanti" del visitatore. Guardando in basso lo sguardo e' quasi
          // verticale, quindi sommiamo sguardo e lato alto del telefono e appiattiamo.
          ref = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
            .add(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion));
          ref.y = 0; ref.normalize();
        }
        let best = -2, bestD = null;
        for (const ax of TOP_AXES) {
          const d = ax.clone().applyQuaternion(_q); d.y = 0;
          if (d.lengthSq() < 0.25) continue;
          d.normalize();
          const dot = d.dot(ref);
          if (dot > best) { best = dot; bestD = d; }
        }
        if (!bestD) return rej('assi');
        yaw = Math.atan2(-bestD.x, -bestD.z) + CFG.topYawOffsetDeg * Math.PI / 180;
      }
    }

    // Punto sul pavimento sotto il centro del pannello.
    const floorY = p.y - CFG.targetCenterHeightM * upmSample;
    const target = new THREE.Vector3(p.x, floorY, p.z);

    if (!anchor.ready || !anchor.fromTarget) {
      anchor.pos.copy(target); anchor.yaw = yaw; anchor.upm = upmSample; anchor.upmSamples = 1;
      anchor.ready = true; anchor.fromTarget = true; anchor.lastSeen = now;
      applyAnchor();
      onAnchored();
      return;
    }

    const dt = Math.min(0.2, (now - anchor.lastSeen) / 1000) || 1 / 30;
    anchor.lastSeen = now;
    const dPos = target.distanceTo(anchor.pos) / anchor.upm;
    const dYaw = wrap(yaw - anchor.yaw);
    anchor.lastDelta = dPos; anchor.lastDYaw = dYaw * 180 / Math.PI;

    // Salti grandi (relocalizzazione SLAM o falso positivo): accettali solo se confermati.
    if (dPos > CFG.jumpDistM || Math.abs(dYaw) > CFG.jumpYawDeg * Math.PI / 180) {
      if (++anchor.pending < CFG.jumpConfirmFrames) return;
    }
    anchor.pending = 0;

    const k = 1 - Math.exp(-dt / CFG.anchorTau);
    anchor.pos.lerp(target, k);
    anchor.yaw = wrap(anchor.yaw + dYaw * k);
    const ks = 1 - Math.exp(-dt / CFG.scaleTau);
    anchor.upm += (upmSample - anchor.upm) * ks;
    anchor.upmSamples++;
    anchor.corrections++;
    applyAnchor();
  }

  // Avvio senza pannello: tunnel piazzato davanti alla camera (il totem si assume a 1 m).
  function fallbackAnchor() {
    if (anchor.ready) return;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); fwd.y = 0;
    if (fwd.lengthSq() < 1e-4) fwd.set(0, 0, -1);
    fwd.normalize();
    anchor.upm = 1;
    anchor.pos.set(camera.position.x + fwd.x * CFG.fallbackDistM, camera.position.y - CFG.camHeight, camera.position.z + fwd.z * CFG.fallbackDistM);
    anchor.yaw = Math.atan2(-fwd.x, -fwd.z);   // normale del "pannello virtuale" verso l'utente
    anchor.ready = true; anchor.fromTarget = false;
    applyAnchor();
    onAnchored();
  }

  function onAnchored() {
    $('calib').classList.add('hidden');
    tunnel.visible = true;
    if (!swarm && window._assets) swarm = createSwarm(window._assets);
  }

  // ═════════════════════════════════════════════════════════════════════════
  // 5. AVVIO 8TH WALL
  // ═════════════════════════════════════════════════════════════════════════
  const canvas = $('xrCanvas');

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }

  async function startXR() {
    // Permessi sensori iOS: SUBITO, dentro il tap
    const reqs = [];
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') reqs.push(DeviceMotionEvent.requestPermission().catch(() => {}));
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') reqs.push(DeviceOrientationEvent.requestPermission().catch(() => {}));
    await Promise.all(reqs);

    $('start').classList.add('hidden');
    $('calib').classList.remove('hidden');
    setTimeout(() => { if (!anchor.ready) $('skipBtn').classList.remove('hidden'); }, CFG.skipAfterMs);

    // modello e target in parallelo all'avvio della camera
    const assetsP = buildButterflyAssets().then((a) => { window._assets = a; if (anchor.ready && !swarm) swarm = createSwarm(a); })
      .catch((e) => console.error('[bfly] modello', e));
    let targetData = null;
    try {
      const r = await fetch(CFG.targetJson, { cache: 'no-cache' });
      if (r.ok) { targetData = await r.json(); tgtDiag.json = 'ok ' + targetData.name; } else tgtDiag.json = 'HTTP ' + r.status;
    } catch (e) { console.warn('[target] json non trovato', e); }

    const boot = () => {
      if (!window.XR8) return showError('Il motore AR non si è caricato. Controlla la connessione e ricarica.');
      const cfg = { disableWorldTracking: false, scale: 'responsive' };
      if (targetData) cfg.imageTargetData = [targetData];
      try { XR8.XrController.configure(cfg); }
      catch (e) { console.warn('[xr8] configure con target fallito, riprovo senza', e); XR8.XrController.configure({ disableWorldTracking: false, scale: 'responsive' }); }

      fitCanvas();
      const mods = [
        XR8.GlTextureRenderer.pipelineModule(),   // video camera
        XR8.Threejs.pipelineModule(),             // three.js nello stesso contesto e frame
        XR8.XrController.pipelineModule(),        // SLAM + image target
      ];
      if (window.XRExtras) mods.unshift(XRExtras.AlmostThere.pipelineModule(), XRExtras.Loading.pipelineModule(), XRExtras.RuntimeError.pipelineModule());
      mods.push({
        name: 'the-link',
        onStart: () => {
          const xs = XR8.Threejs.xrScene();
          camera = xs.camera; renderer = xs.renderer;
          setupScene(xs.scene);
          camera.position.set(0, CFG.camHeight, 0);
          XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });
          if (CFG.hands) initHands();
        },
        onUpdate: ({ processCpuResult }) => {
          const dt = Math.min(clock.getDelta(), 0.1);
          if (swarm && tunnel.visible) swarm.update(dt);
          if (CFG.debug) updateHud();
        },
        // La mano legge il frame SUBITO dopo il render di three (stesso task, prima che il
        // browser presenti il frame): cosi' il canvas WebGL e' ancora leggibile e le coordinate
        // coincidono esattamente con lo schermo. (Il pixel array di 8th Wall usato prima e'
        // nell'orientamento del sensore e non allineato al display: la mano non veniva trovata.)
        onRender: () => { if (CFG.hands) feedHands(); },
        onCanvasSizeChange: fitCanvas,
        listeners: [
          { event: 'reality.imagefound', process: ({ detail }) => onTargetPose(detail) },
          { event: 'reality.imageupdated', process: ({ detail }) => onTargetPose(detail) },
          { event: 'reality.imageloading', process: () => { tgtDiag.loading++; } },
          { event: 'reality.imagescanning', process: () => { tgtDiag.scanning++; } },
          { event: 'reality.imagefound', process: () => { tgtDiag.found++; } },
          { event: 'reality.imageupdated', process: () => { tgtDiag.updated++; } },
          { event: 'reality.trackingstatus', process: ({ detail }) => { trackingStatus = detail.status; trackingReason = detail.reason || ''; } },
        ],
      });
      XR8.addCameraPipelineModules(mods);
      XR8.run({ canvas });
      started = true;
    };
    if (window.XR8) boot(); else window.addEventListener('xrloaded', boot, { once: true });
    await assetsP;
  }

  function showError(msg) { $('errorText').textContent = msg; $('error').classList.remove('hidden'); }

  $('startBtn').addEventListener('click', () => (CFG.preview ? startPreview() : startXR()));
  $('skipBtn').addEventListener('click', () => fallbackAnchor());

  function checkOrientation() {
    const land = window.innerWidth > window.innerHeight && matchMedia('(pointer: coarse)').matches;
    $('rotate').classList.toggle('hidden', !land);
  }
  window.addEventListener('resize', checkOrientation); checkOrientation();

  // ═════════════════════════════════════════════════════════════════════════
  // 6. MANO (MediaPipe Hands) — alimentata dal pixel array di 8th Wall
  // ═════════════════════════════════════════════════════════════════════════
  let hands = null, handBusy = false, lastHandT = 0, handCanvas, handCtx, handImg;
  let openCount = 0, wasShowing = false, middleCount = 0, middleUntil = 0, tooCloseState = false;

  function initHands() {
    if (typeof window.Hands === 'undefined') { console.warn('[hand] MediaPipe non caricato'); CFG.hands = false; return; }
    handCanvas = document.createElement('canvas'); handCtx = handCanvas.getContext('2d');
    hands = new window.Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults((r) => { handDiag.results++; onHandResults(r); });
  }

  const handDiag = { sends: 0, results: 0, err: '' };
  function feedHands() {
    if (!hands || handBusy) return;
    const now = performance.now();
    if (now - lastHandT < 1000 / CFG.handFps) return;
    lastHandT = now;
    // copia ridotta del canvas (lato corto 320 px): abbastanza per MediaPipe, leggera da copiare
    const sc = 320 / Math.min(canvas.width, canvas.height);
    const w = Math.round(canvas.width * sc), h = Math.round(canvas.height * sc);
    if (handCanvas.width !== w || handCanvas.height !== h) { handCanvas.width = w; handCanvas.height = h; }
    try { handCtx.drawImage(canvas, 0, 0, w, h); } catch (e) { handDiag.err = 'draw ' + e.name; return; }
    handBusy = true; handDiag.sends++;
    hands.send({ image: handCanvas })
      .catch((e) => { handDiag.err = 'send ' + (e && e.message || e); })
      .finally(() => { handBusy = false; });
  }


  function onHandResults(res) {
    const now = performance.now();
    const list = res.multiHandLandmarks || [];
    const W = window.innerWidth, H = window.innerHeight;
    const toScreen = (p) => ({ x: p.x * W + CFG.handOffsetX, y: p.y * H });
    let open = false, pos = null, size = 160, px = 0, middle = false;
    for (const lm of list) {
      const w0 = toScreen(lm[0]), k9 = toScreen(lm[9]);
      const hs = Math.hypot(k9.x - w0.x, k9.y - w0.y);
      px = Math.max(px, hs);
      if (hs < 50) continue;
      if (isMiddle(lm)) middle = true;
      if (isOpen(lm)) {
        open = true;
        const kx = (lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 4, ky = (lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 4;
        pos = toScreen({ x: lm[0].x * 0.5 + kx * 0.5, y: lm[0].y * 0.5 + ky * 0.5 });
        pos.y -= hs * 0.2;
        size = Math.max(70, Math.min(300, hs * CFG.lottieScale));
      }
    }
    middleCount = middle ? Math.min(middleCount + 1, 6) : Math.max(middleCount - 1, 0);
    if (middleCount >= 3) middleUntil = now + 1500;
    const rude = now < middleUntil;
    $('rude').style.opacity = rude ? '1' : '0';

    const thr = H * CFG.tooCloseFrac;
    if (px > thr) tooCloseState = true; else if (px < thr * 0.85) tooCloseState = false;
    $('tooClose').style.opacity = tooCloseState ? '1' : '0';

    openCount = (open && !rude) ? Math.min(openCount + 1, 6) : Math.max(openCount - 1, 0);
    const box = $('handLottie'), anim = $('lottieAnim');
    if (openCount >= 3 && pos) {
      box.style.display = 'block'; box.style.left = pos.x + 'px'; box.style.top = pos.y + 'px';
      anim.style.width = anim.style.height = size + 'px';
      if (!wasShowing && anim.play) { anim.seek && anim.seek(0); anim.play(); }
      wasShowing = true;
    } else if (openCount === 0) {
      box.style.display = 'none';
      if (wasShowing && anim.stop) anim.stop();
      wasShowing = false;
    }
    window._handsN = list.length;
  }
  const isOpen = (lm) => [[8, 5], [12, 9], [16, 13], [20, 17]].filter(([t, m]) => lm[t].y < lm[m].y).length >= 3;
  const isMiddle = (lm) => lm[12].y < lm[10].y && lm[10].y < lm[9].y && lm[8].y > lm[6].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;

  // ═════════════════════════════════════════════════════════════════════════
  // 7. HUD DEBUG
  // ═════════════════════════════════════════════════════════════════════════
  let fpsAcc = 0, fpsN = 0, fps = 0, fpsT = performance.now();
  function updateHud() {
    fpsN++; const now = performance.now();
    if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
    const el = $('hud'); el.classList.remove('hidden');
    const seen = anchor.lastSeen ? ((now - anchor.lastSeen) / 1000).toFixed(1) + 's fa' : 'mai';
    el.textContent =
      `fps ${fps.toFixed(0)} | trk ${trackingStatus} ${trackingReason}\n` +
      `ancora ${anchor.ready ? (anchor.fromTarget ? 'PANNELLO' : 'FALLBACK') : '-'} | pannello visto ${seen}\n` +
      `scala ${anchor.upm.toFixed(3)} u/m (${anchor.upmSamples} campioni) | yaw ${(anchor.yaw * 180 / Math.PI).toFixed(1)}°\n` +
      `ultima corr. ${anchor.lastDelta.toFixed(2)} m / ${anchor.lastDYaw.toFixed(1)}° | tot ${anchor.corrections}\n` +
      `mano: invii ${handDiag.sends} risultati ${handDiag.results} ${handDiag.err} ${CFG.hands ? '' : '(OFF)'}\n` +
      `farfalle ${swarm ? CFG.count : 0} | mani ${window._handsN || 0} | visitatore x ${(window._visitorX || 0).toFixed(1)} m (finestra ${(window._winC || 0).toFixed(1)})\n` +
      `target json ${tgtDiag.json} | load ${tgtDiag.loading} scan ${tgtDiag.scanning}\n` +
      `found ${tgtDiag.found} upd ${tgtDiag.updated} | ny ${(tgtDiag.ny || 0).toFixed(2)} | solo-pos ${tgtDiag.posOnly || 0}\n` +
      `scartati ${tgtDiag.rejected} ${tgtDiag.lastReject}`;
  }

  // ═════════════════════════════════════════════════════════════════════════
  // 8. ANTEPRIMA DESKTOP (?preview): stessa scena, senza AR
  // ═════════════════════════════════════════════════════════════════════════
  async function startPreview() {
    $('start').classList.add('hidden');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setClearColor(0x2a3140);
    camera = new THREE.PerspectiveCamera(63, innerWidth / innerHeight, 0.05, 200);
    // visitatore a 1.2 m davanti al pannello, telefono a 1.45 m
    camera.position.set(+(Q.get('x') || 0), CFG.camHeight, 1.2);
    // frecce sinistra/destra: cammina lungo il nastro (per provare il tratto visibile)
    addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') camera.position.x -= 0.5; if (e.key === 'ArrowRight') camera.position.x += 0.5; });
    let yaw = +(Q.get('yaw') || 0) * Math.PI / 180, pitch = +(Q.get('pitch') || 8) * Math.PI / 180;
    const sc = new THREE.Scene(); setupScene(sc);
    const grid = new THREE.GridHelper(40, 40, 0x445066, 0x333a48); sc.add(grid);
    anchor.pos.set(0, 0, 0); anchor.yaw = 0; anchor.upm = 1; anchor.ready = true; anchor.fromTarget = true;
    applyAnchor();
    window._assets = await buildButterflyAssets();
    onAnchored();
    let drag = null;
    canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; });
    addEventListener('pointerup', () => { drag = null; });
    addEventListener('pointermove', (e) => { if (!drag) return; yaw = drag.yaw + (e.clientX - drag.x) * 0.005; pitch = Math.max(-1.2, Math.min(1.2, drag.pitch + (e.clientY - drag.y) * 0.005)); });
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
    CFG.debug = true;
    (function loop() {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.1);
      camera.rotation.set(-pitch, -yaw, 0, 'YXZ');
      swarm && swarm.update(dt);
      renderer.render(sc, camera);
      updateHud();
    })();
  }
  if (CFG.preview && Q.has('autostart')) startPreview();
  </script>
</body>
